spring:
  application:
    name: webhooks
  datasource:
    url: jdbc:h2:file:./data/webhooks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    url: jdbc:h2:file:./data/webhooks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    user: sa
    password:
    enabled: true
    locations: classpath:db/migrations
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

stripe:
  secret: ${STRIPE_SECRET:1234567890}
